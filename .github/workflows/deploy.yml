# Construye el sitio y lo publica en GitHub Pages.
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_call: # lo usa actualizar.yml: un push hecho con GITHUB_TOKEN no dispara otros workflows
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # llamado desde actualizar.yml, el commit por defecto sería el de antes de la corrida
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5

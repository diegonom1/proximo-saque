# Corrida semanal de los agentes: guarda lo directo en main, deja lo demás en el PR de revisión y publica.
name: Actualizar datos

on:
  schedule:
    - cron: '17 12 * * 1' # lunes 06:17 de Tonalá
  workflow_dispatch:

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    # La programada queda apagada hasta poner la variable CORRIDA_PROGRAMADA en true: la primera se lanza a mano.
    if: github.event_name == 'workflow_dispatch' || vars.CORRIDA_PROGRAMADA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GEMINI_MODELOS: ${{ vars.GEMINI_MODELOS }}
      MAX_LLAMADAS: ${{ vars.MAX_LLAMADAS }}
      BUSQUEDA: ${{ vars.BUSQUEDA }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Partir de lo aprobado y del PR abierto
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          estado=$(gh pr list --head revision-semanal --state all --limit 1 --json state --jq '.[0].state // ""')
          echo "PR_ESTADO=$estado" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/aprobados" "$RUNNER_TEMP/resultado"
          cp data/*.json "$RUNNER_TEMP/aprobados/"
          echo "DIR_APROBADOS=$RUNNER_TEMP/aprobados" >> "$GITHUB_ENV"
          # Con el PR abierto se acumula sobre su rama. Si choca con main, gana lo aprobado.
          if [ "$estado" = OPEN ]; then
            git fetch origin revision-semanal
            git checkout -B revision-semanal FETCH_HEAD
            git merge --no-edit -X theirs origin/main
          fi

      - name: Correr agentes
        run: npm run agentes

      - name: Guardar directo en main
        run: |
          cp data/*.json "$RUNNER_TEMP/resultado/"
          git checkout -f main
          git reset --hard origin/main
          for archivo in partidos rankings seleccion estado-agentes; do
            cp "$RUNNER_TEMP/resultado/$archivo.json" data/
          done
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiza partidos, rankings y Selección'
            git push origin main || { git pull --rebase origin main && git push origin main; }
          fi

      - name: Preparar lo que va al PR
        run: |
          for archivo in jugadoras clubes ligas torneos; do
            cp "$RUNNER_TEMP/resultado/$archivo.json" data/
          done
          # Las altas que siguen en el PR también necesitan su carpeta de fotos.
          for slug in $(jq -r '.[].slug' data/jugadoras.json); do
            carpeta="src/assets/fotos/jugadoras/$slug"
            if [ ! -d "$carpeta" ]; then
              mkdir -p "$carpeta"
              touch "$carpeta/.gitkeep"
            fi
          done

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: revision-semanal
          base: main
          title: Revisión semanal de datos
          commit-message: Revisión semanal de datos
          body-path: revision-semanal.md
          add-paths: |
            data/jugadoras.json
            data/clubes.json
            data/ligas.json
            data/torneos.json
            src/assets/fotos/jugadoras/*/.gitkeep

  publicar:
    needs: actualizar
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

name: Actualizar partidos

on:
  schedule:
    # Lunes 06:17 de Tonalá (12:17 UTC). GitHub usa UTC.
    - cron: '17 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-partidos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buscar los próximos partidos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/actualizar.mjs

      - name: Guardar cambios
        run: |
          if git diff --quiet -- data/; then
            echo "Sin cambios en los partidos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Actualizar próximos partidos"
          git push
